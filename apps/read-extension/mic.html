<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IOTx Read: microphone</title>
  <link rel="stylesheet" href="popup.css" />
  <style>body { width: auto; max-width: 460px; margin: 40px auto; font-size: 14px; }</style>
</head>
<body>
  <h1 style="font-size: 18px">Let IOTx Read hear your microphone</h1>
  <p>So your own voice is in the meeting notes too, the extension mixes your microphone with the call's sound while it records. Chrome asks once; the microphone is only used while a recording you started is running.</p>
  <button id="allow" class="primary">Allow microphone</button>
  <p id="out" class="muted"></p>
  <script src="mic.js"></script>
</body>
</html>
